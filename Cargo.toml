[workspace]
members = [
    "crates/core",
    "crates/crypto",
    "crates/server",
    "crates/register-wasm",
    "crates/storage",
    "crates/sync",
    "crates/tui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only OR AGPL-3.0-only"
repository = "https://github.com/Mil0R/LemonTodo"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0"
hex = "0.4"
password-hash = "0.5"
rand = "0.8"
ratatui = "0.29"
rpassword = "7.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors"] }
unicode-width = "0.2"
ureq = { version = "3.1", features = ["json"] }
uuid = { version = "1.19", features = ["serde", "v4"] }
wasm-bindgen = "0.2"
