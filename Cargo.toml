[workspace]
members = [
    "crates/core",
    "crates/storage",
    "crates/tui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only OR AGPL-3.0-only"
repository = "https://github.com/Mil0R/LemonTodo"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0"
ratatui = "0.29"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
unicode-width = "0.2"
uuid = { version = "1.19", features = ["serde", "v4"] }
