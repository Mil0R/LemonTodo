services:
  lemontodo:
    image: ${LEMONTODO_IMAGE:-ghcr.io/mil0r/lemontodo:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${LEMONTODO_PORT:-8787}:8787"
    environment:
      LEMONTODO_SERVER_HOST: 0.0.0.0
      LEMONTODO_SERVER_PORT: 8787
      LEMONTODO_SERVER_DB: /data/lemontodo.db
      LEMONTODO_ALLOW_REGISTRATION: ${LEMONTODO_ALLOW_REGISTRATION:-false}
      LEMONTODO_SESSION_TTL_SECS: ${LEMONTODO_SESSION_TTL_SECS:-2592000}
      LEMONTODO_ADMIN_EMAIL: ${LEMONTODO_ADMIN_EMAIL:-}
      LEMONTODO_ADMIN_PASSWORD: ${LEMONTODO_ADMIN_PASSWORD:-}
      LEMONTODO_ADMIN_PASSWORD_FILE: ${LEMONTODO_ADMIN_PASSWORD_FILE:-}
      LEMONTODO_REGISTER_WASM_DIR: /opt/lemontodo/register-wasm
      LEMONTODO_WEB_STATIC_DIR: /opt/lemontodo/web
      LEMONTODO_WEB_CLIENT_URL: /
    volumes:
      - lemontodo-data:/data

volumes:
  lemontodo-data:
